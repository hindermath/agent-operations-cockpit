name: Public Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Scan full checked-out repository for secrets
        run: python3 scripts/lib/check_learning_package_secrets.py .
      - name: Run secret scan
        run: bash scripts/scan-agent-secrets.sh --fail-on-high .
      - name: Reject personal absolute paths and committed preset cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # git grep uses exit code 1 for "no match"; inspect that expected result below.
          $PSNativeCommandUseErrorActionPreference = $false
          $tracked = @(git ls-files)
          if ($tracked -match '^\.specify/presets/\.cache/') {
              throw 'The local Spec Kit preset cache must not be committed.'
          }
          $patterns = @(
              ('/Us' + 'ers/[[:alnum:]_.-]+/'),
              ('/ho' + 'me/[[:alnum:]_.-]+/'),
              '[A-Za-z]:\\Users\\[[:alnum:]_.-]+\\'
          )
          foreach ($pattern in $patterns) {
              $matches = git grep -n -I -E -- $pattern 2>$null
              $grepExitCode = $LASTEXITCODE
              if ($grepExitCode -eq 0) {
                  $matches
                  throw "Personal absolute path pattern found: ${pattern}"
              }
              if ($grepExitCode -ne 1) {
                  throw "git grep failed for pattern: ${pattern}"
              }
          }
          exit 0

  dotnet-contract:
    name: .NET contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore, build, and test approved product projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @()
          if (Test-Path src) { $roots += Get-Item src }
          if (Test-Path tests) { $roots += Get-Item tests }
          $manifests = @(
              Get-ChildItem -Path . -File -Include *.sln,*.slnx,*.csproj
              foreach ($root in $roots) {
                  Get-ChildItem -Path $root.FullName -Recurse -File -Include *.sln,*.slnx,*.csproj
              }
          ) | Sort-Object FullName -Unique
          if ($manifests.Count -eq 0) {
              'NotApplicable: no approved product solution or project exists.'
              'Restore, build, and test become mandatory with the first product scaffold.'
              exit 0
          }
          $solutions = @($manifests | Where-Object Extension -In '.sln', '.slnx')
          if ($solutions.Count -ne 1) {
              throw 'Expected exactly one product solution once product manifests exist.'
          }
          dotnet restore $solutions[0].FullName
          dotnet build $solutions[0].FullName --no-restore --configuration Release
          dotnet test $solutions[0].FullName --no-build --configuration Release
