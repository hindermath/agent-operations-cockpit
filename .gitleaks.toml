# gitleaks-Konfiguration / gitleaks configuration
#
# DE: Die sichere-Entwicklung-Lehrdokumentation enthält absichtlich erkennbare
# Negativbeispiele wie PEM-/OpenSSH-Schlüssel-Kopfzeilen sowie erklärenden Text
# mit Framework-Namen. Standardregeln melden diese Texte als Falschpositive,
# obwohl sie keine Geheimnisse enthalten. Die Ausnahme ist deshalb auf
# Markdown-Lehrmaterial unter docs/secure-development/ begrenzt. Drei
# Quellhash-Eintraege in den Phase-Result-Fixtures sind keine API-Schluessel;
# nur ihre exakten JSON-Zeilenformen sind zusaetzlich ausgenommen.
#
# EN: The secure-development teaching documentation intentionally contains
# recognisable negative examples such as PEM/OpenSSH key headers and explanatory
# prose with framework names. Default rules report these texts as false
# positives even though they contain no secrets. The exception is therefore
# limited to Markdown teaching material under docs/secure-development/.
# Three SHA-256 source-hash entries in phase-result fixtures are also exempted
# by their exact Gitleaks match and hash, while surrounding content stays scanned.

title = "Agent Operations Cockpit gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Teaching documentation and three SHA-256 fixture source-hash false positives"
paths = [
  '''docs/secure-development/.*\.md$''',
]
regexTarget = "match"
regexes = [
  '''^analyze-secret-scan\.json": "902b5b05f8868f26aa75cf373a47ccd15014b3878c60d0b62730276be2c93670"$''',
  '''^analyze-2-secrets\.json": "646519af6650ef5e4e71d309e23e0100f78c656f02e0c7e620727721e999125e"$''',
  '''^negative-secret-material\.json": "66dd07be6b5d868070e87aadfe9a2d036b793aef0f29c4f976085e9e005bdb08"$''',
]
