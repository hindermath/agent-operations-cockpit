# gitleaks-Konfiguration / gitleaks configuration
#
# DE: Lehrdokumente werden ohne Pfadausnahme gescannt. Die CI akzeptiert
# einzelne geprüfte Falschpositive nur bei identischem Datei-Hash, Pfad,
# Regel und Zeile. Drei Quellhash-Eintraege in Phase-Result-Fixtures sind
# keine API-Schluessel; nur ihre exakten JSON-Zeilenformen sind hier ausgenommen.
#
# EN: Teaching documents are scanned without a path exemption. CI accepts
# individual reviewed false positives only with an identical file hash, path,
# rule and line. Three source hashes in phase-result fixtures are exempted here
# only by their exact Gitleaks match; surrounding content remains scanned.

title = "Agent Operations Cockpit gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Three SHA-256 fixture source-hash false positives"
regexTarget = "match"
regexes = [
  '''^analyze-secret-scan\.json": "902b5b05f8868f26aa75cf373a47ccd15014b3878c60d0b62730276be2c93670"$''',
  '''^analyze-2-secrets\.json": "646519af6650ef5e4e71d309e23e0100f78c656f02e0c7e620727721e999125e"$''',
  '''^negative-secret-material\.json": "66dd07be6b5d868070e87aadfe9a2d036b793aef0f29c4f976085e9e005bdb08"$''',
]
